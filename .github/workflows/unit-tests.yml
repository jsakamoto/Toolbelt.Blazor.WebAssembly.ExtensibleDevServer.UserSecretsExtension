name: unit tests

on:
  push:
    branches:
      - main

jobs:
  perform-unit-tests:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v6

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Perform unit tests
      - name: Perform unit tests
        run: dotnet test --project ./UserSecretsExtension.Test --output detailed
